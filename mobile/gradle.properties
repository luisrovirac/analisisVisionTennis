org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# Los targets de iOS solo compilan en macOS; en Windows/Linux se omiten sin fallar.
kotlin.native.ignoreDisabledTargets=true

# Entorno de desarrollo (sobrescríbelos en ~/.gradle/gradle.properties o con -P).
# Con `adb reverse` el emulador/teléfono ve los puertos del PC como localhost (ver mobile/README.md),
# y así el `iss` de los tokens coincide con el que espera la API.
tennis.apiBaseUrl=http://localhost:8080
tennis.oidcIssuer=http://localhost:8180/realms/tennis
tennis.oidcClientId=tennis-mobile
