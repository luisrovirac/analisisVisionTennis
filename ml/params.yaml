# Parámetros versionados del pipeline (dvc.yaml los cita: cambiar uno invalida solo las etapas afectadas).
version: ""  # versión del modelo exportado; vacío = <fecha>-<run id de MLflow>

dataset:
  name: thetis  # carpeta en data/raw/: thetis | own | toy
  seed: 42
  # Partición por jugador (no por clip): el mismo jugador nunca está en train y en test.
  splits: {train: 0.7, val: 0.2, test: 0.1}

# "other" agrupa lo que no es un golpe soportado (p. ej. el smash de THETIS): el worker lo
# trata como no reconocido (UNSUPPORTED_STROKE).
classes: [forehand, backhand, serve, volley, other]

pose_model: /models/pose_landmarker_full.task

pose_seq:
  seq_len: 64
  hidden: 128
  layers: 2
  dropout: 0.2
  epochs: 40
  batch_size: 32
  lr: 0.001
  # Umbral de confianza recomendado: el menor que alcanza esta precisión en validación.
  target_precision: 0.95
  # Palancas de experimentación (neutros por defecto; DVC las versiona).
  # El peso base de `other` ya es inversamente proporcional a su frecuencia (~2.4); boost lo multiplica.
  # Configuración del mejor variante del barrido de 2026-11-17 (ver metrics/sweep_results_20261117.json).
  # Mejora other F1 0.609→0.75 y other→serve 5/15→1/15, pero aún no alcanza las compuertas de publicación.
  other_weight_boost: 2.0
  noise_std: 0.01      # ruido gaussiano sobre las coordenadas de pose (solo train)
  time_warp: 0.02      # aceleración/ralentización aleatoria de la secuencia (solo train)
  other_serve_penalty: 0.5  # penalización de other→serve al elegir época (0 = solo macro-F1)

yolo:
  base: yolo11n.pt
  frames_per_clip: 8  # fotogramas etiquetados por clip para entrenar
  clip_frames: 16  # fotogramas que muestrea el worker al clasificar
  imgsz: 640
  epochs: 50
  device: "0"  # GPU local disponible; volver a "cpu" si no hay GPU
