[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tennis-ml"
version = "0.1.0"
description = "Pipeline de entrenamiento del clasificador de golpes (DVC + MLflow). Reutiliza tennis-worker."
requires-python = ">=3.10,<3.13"
# tennis-worker no está en PyPI: se instala antes desde ../worker (ver Dockerfile).
dependencies = [
  "tennis-worker",
  "torch>=2.3",
  "onnx>=1.16,<1.18",  # 1.18+ exige numpy 2; mediapipe (worker) necesita numpy<2
  "mlflow==2.22.0",
  "dvc[s3]>=3.50,<4",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "boto3>=1.34,<2",
]

[project.optional-dependencies]
# Ultralytics es AGPL-3.0: los modelos que entrena heredan esa licencia salvo licencia Enterprise.
yolo = ["ultralytics>=8.3,<9"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "A", "C90", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "N812"]  # N812: `import torch.nn.functional as F` es la convención

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
