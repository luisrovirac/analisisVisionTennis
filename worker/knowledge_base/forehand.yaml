# Base de conocimiento del FOREHAND (semilla).
# ⚠ Umbrales PROVISIONALES. Desde el portal de expertos este archivo es solo la SEMILLA: el worker lo
#   importa a Postgres la primera vez (versión publicada inicial). A partir de ahí los cambios se hacen
#   en el portal (el experto propone, el validador aprueba) y no editando este archivo.
# Guía: Docs/BASE_CONOCIMIENTO.md · Esquema: contracts/knowledge_base.schema.json
# 0.3.0: +12 reglas con las métricas nuevas (base, cabeza, swing de abajo arriba, piernas, brazo libre,
#        antelación de la preparación). Si la base activa en Postgres sigue siendo la semilla sin tocar
#        desde el portal, el worker la actualiza solo a esta versión al arrancar.
# 0.3.1: head_stability pasa a medirse en la imagen (largos de torso); umbrales 0.25 / 0.1.
# 0.3.2: campo views: reglas que solo son fiables con vista de perfil (side) o frontal/trasera.
# 0.4.0: FH-HEAD-001 pasa de head_stability > 0.25 a > 0.35: saltaba con Sinner y Lehecka (cota 0,32).
#        Ver Docs/VALIDACION_REGLAS.md (validación con profesionales dejando fuera a cada jugador, 2026-11-24).
stroke: forehand
version: 0.4.0
validated_by: null

rules:
  # ---------- Errores fundamentales (postura / preparación / contacto) ----------
  - id: FH-PREP-001
    title: Preparación sin giro de hombros
    category: fundamental
    impact: 5
    difficulty: 1
    when:
      all:
        - {metric: shoulder_rotation_range, op: lt, value: 45}
    explanation: >
      Los hombros apenas rotan entre la preparación y el impacto. Sin ese giro el golpe pierde
      potencia y dependes casi solo del brazo.
    correction: >
      Al ver venir la bola, gira los hombros hasta que el hombro no dominante apunte a la bola,
      llevando la raqueta atrás con el giro del tronco, no solo con el brazo.
    drills:
      - "Sombra frente a un espejo: gira hasta ver tu espalda de perfil y pausa 1 s antes de golpear."
      - "Golpes desde el pie con la mano no dominante señalando la bola hasta el último momento."

  - id: FH-POST-001
    title: Piernas rígidas (sin flexión de rodillas)
    category: fundamental
    impact: 4
    difficulty: 1
    when:
      all:
        - {metric: knee_angle_min, op: gt, value: 160}
    explanation: >
      Las rodillas casi no se flexionan durante la preparación, así que las piernas no aportan
      impulso ni estabilidad al golpe.
    correction: >
      Flexiona las rodillas al preparar (como para sentarte en un taburete alto) y empuja desde el
      suelo hacia arriba y hacia delante al golpear.
    drills:
      - "Series de 10 golpes con la consigna: 'bajo al preparar, subo al golpear'."
      - "Sentadillas con pausa en posición de preparación (3 x 10)."

  - id: FH-CONT-001
    title: Punto de impacto atrasado
    category: fundamental
    impact: 5
    difficulty: 2
    views: [side]
    caused_by: [FH-PREP-001, FH-PREP-002]  # sin giro o con giro tardío, el impacto se atrasa
    when:
      all:
        - {metric: contact_point_ahead, op: lt, value: 0.15}
    explanation: >
      Golpeas la bola demasiado cerca del cuerpo o por detrás de él. Pierdes control de la
      dirección y fuerzas el brazo.
    correction: >
      Busca el impacto por delante de la cadera delantera, con el brazo cómodo y extendido.
      Prepara antes para tener tiempo de ir a buscar la bola delante.
    drills:
      - "Coloca un cono a un paso por delante de tu pie adelantado e intenta golpear a su altura."
      - "Peloteo con bolas lentas pausando en el punto de impacto para comprobar la posición."

  - id: FH-FIN-001
    title: Terminación corta
    category: fundamental
    impact: 3
    difficulty: 1
    caused_by: [FH-CONT-001]  # un impacto atrasado frena el swing antes de tiempo
    when:
      all:
        - {metric: follow_through_height, op: lt, value: 0.0}
    explanation: >
      El brazo no termina por encima del hombro: el swing se frena antes de tiempo y la bola sale
      sin efecto y con menos profundidad.
    correction: >
      Deja que la raqueta siga su recorrido hasta terminar por encima del hombro contrario,
      con el codo apuntando hacia la red.
    drills:
      - "Sombra exagerando la terminación: termina 'atrapando' la raqueta con la mano no dominante."

  - id: FH-ARM-001
    title: Codo demasiado flexionado en el impacto
    category: fundamental
    impact: 3
    difficulty: 2
    when:
      all:
        - {metric: elbow_angle_at_impact, op: lt, value: 100}
    explanation: >
      El brazo llega muy encogido al impacto, lo que reduce el radio del swing y suele indicar que
      estás demasiado cerca de la bola.
    correction: >
      Separa un poco más la bola del cuerpo y deja que el brazo se extienda de forma natural en el
      impacto, sin bloquearlo del todo.
    drills:
      - "Golpes con una pelota bajo la axila del brazo libre para mantener la estructura y la distancia."

  # ---------- Errores de sincronización (cadena cinética) ----------
  - id: FH-SYNC-001
    title: Cadera y hombros giran en bloque
    category: sincronizacion
    impact: 4
    difficulty: 4
    when:
      all:
        - {metric: hip_shoulder_separation_max, op: lt, value: 15}
    explanation: >
      Cadera y hombros giran a la vez, sin separación entre ellos. Se pierde la "torsión" que
      almacena energía elástica en el tronco.
    correction: >
      Inicia el swing hacia delante con la cadera mientras los hombros todavía están girados;
      los hombros deben seguir a la cadera una fracción de segundo después.
    drills:
      - "Sombra en dos tiempos: 1) gira la cadera, 2) suelta hombros y brazo."
      - "Lanzamientos laterales con balón medicinal desde posición de preparación."

  - id: FH-SYNC-002
    title: Cadena cinética desordenada
    category: sincronizacion
    impact: 5
    difficulty: 5
    when:
      all:
        - {metric: kinetic_chain_sequence, op: eq, value: 0}
    explanation: >
      Los segmentos del cuerpo no alcanzan su máxima velocidad en el orden eficiente
      (cadera → hombros → brazo). La energía no se transmite de forma escalonada.
    correction: >
      Piensa en el golpe como un látigo: primero piernas y cadera, después el tronco y, por último,
      el brazo y la raqueta. Trabaja a velocidad lenta hasta automatizar el orden.
    drills:
      - "Golpes a cámara lenta contando en voz alta '1-cadera, 2-hombros, 3-brazo'."
      - "Lanzamientos de balón medicinal con rotación, enfatizando el inicio desde la cadera."

  - id: FH-SYNC-003
    title: Golpeo con el brazo
    category: sincronizacion
    impact: 5
    difficulty: 4
    caused_by: [FH-SYNC-001]  # sin separación cadera-hombros el brazo compensa
    when:
      all:
        - {metric: hip_shoulder_separation_max, op: lt, value: 20}
        - {metric: elbow_angle_at_impact, op: lt, value: 110}
    explanation: >
      La cadera apenas participa y el codo llega flexionado al impacto: el golpe se genera
      principalmente con el brazo, lo que limita la potencia y sobrecarga hombro y codo.
    correction: >
      Inicia el movimiento desde las caderas y deja que el brazo sea el último eslabón, llegando
      relajado y extendido al impacto.
    drills:
      - "Golpes con el brazo 'muerto': la rotación de cadera y tronco es la que lleva la raqueta."

  # ---------- Puntos fuertes (polarity: strength) ----------
  # Un punto fuerte NO es la ausencia de un error: tiene su propio umbral, más exigente.
  # suppressed_by: no se elogia si aparece un error que lo contradice (las reglas de salud mandan).
  - id: FH-STR-001
    title: Buena rotación de hombros en la preparación
    category: fundamental
    polarity: strength
    impact: 5
    difficulty: 1
    when:
      all:
        - {metric: shoulder_rotation_range, op: gte, value: 70}
    explanation: Giras los hombros ampliamente entre la preparación y el impacto.
    why_it_matters: >
      Ese giro del tronco genera potencia sin depender solo del brazo y protege hombro y codo.
    how_to_maintain: >
      Mantén el giro como base: es tu mejor herramienta para llegar antes al punto de impacto.

  - id: FH-STR-002
    title: Separación cadera-hombros que genera potencia elástica
    category: sincronizacion
    polarity: strength
    impact: 4
    difficulty: 3
    when:
      all:
        - {metric: hip_shoulder_separation_max, op: gte, value: 25}
    explanation: La cadera se adelanta a los hombros antes del impacto.
    why_it_matters: >
      Esa torsión almacena energía elástica en el tronco y la libera en el golpe.
    how_to_maintain: >
      Sigue iniciando el swing con la cadera mientras los hombros todavía están girados.

  - id: FH-STR-003
    title: Cadena cinética bien secuenciada
    category: sincronizacion
    polarity: strength
    impact: 5
    difficulty: 5
    suppressed_by: [FH-SYNC-003]
    when:
      all:
        - {metric: kinetic_chain_sequence, op: eq, value: 1}
    explanation: Cadera, hombros y brazo alcanzan su máxima velocidad en el orden eficiente.
    why_it_matters: >
      La energía se transmite escalonadamente desde el suelo hasta la raqueta: más potencia con
      menos esfuerzo del brazo.
    how_to_maintain: >
      Usa este patrón como referencia también en el revés y el saque.

  - id: FH-STR-004
    title: Punto de contacto adelantado
    category: fundamental
    polarity: strength
    impact: 5
    difficulty: 2
    views: [side]
    when:
      all:
        - {metric: contact_point_ahead, op: gte, value: 0.2}
    explanation: Golpeas la bola claramente por delante de la cadera.
    why_it_matters: >
      Te da control de la dirección, un impacto más limpio y menos carga en el brazo.
    how_to_maintain: >
      Prepara pronto para conservar ese punto de impacto también con bolas rápidas.

  - id: FH-STR-005
    title: Terminación completa y alta
    category: fundamental
    polarity: strength
    impact: 3
    difficulty: 1
    when:
      all:
        - {metric: follow_through_height, op: gte, value: 0.1}
    explanation: El brazo termina claramente por encima del hombro.
    why_it_matters: >
      Una terminación completa da profundidad y efecto, y frena el brazo de forma progresiva.
    how_to_maintain: >
      Deja que la raqueta siga su recorrido natural; no frenes el swing al impactar.

  - id: FH-STR-006
    title: Flexión de piernas activa
    category: fundamental
    polarity: strength
    impact: 4
    difficulty: 1
    when:
      all:
        - {metric: knee_angle_min, op: between, value: [110, 145]}
    explanation: Flexionas las rodillas en la preparación y cargas el peso.
    why_it_matters: >
      Las piernas aportan estabilidad e impulso desde el suelo hacia el golpe.
    how_to_maintain: >
      Repite la misma profundidad en cada golpe, también cuando vas con prisa.

  - id: FH-STR-007
    title: Brazo de golpeo en rango eficiente al impacto
    category: fundamental
    polarity: strength
    impact: 3
    difficulty: 2
    suppressed_by: [FH-SYNC-003, FH-ARM-001]
    when:
      all:
        - {metric: elbow_angle_at_impact, op: between, value: [120, 170]}
    explanation: El brazo llega al impacto cómodo y extendido, sin bloquearse.
    why_it_matters: >
      Mayor radio de swing y mejor control de la bola sin forzar el codo.
    how_to_maintain: >
      Mantén la distancia a la bola; deja que el brazo acompañe el giro del cuerpo.

  # =====================================================================================================
  # 0.3.0 — Reglas con las métricas nuevas. Umbrales PROVISIONALES estimados para pose 2D desde video:
  # la literatura (captura 3D en laboratorio) indica QUÉ medir y en qué dirección está el error, pero el
  # valor exacto lo debe calibrar un experto desde el portal con videos reales.
  # =====================================================================================================

  # ---------- Errores ----------
  - id: FH-PREP-002
    title: Preparación tardía
    category: fundamental
    impact: 5
    difficulty: 2
    when:
      all:
        - {metric: unit_turn_lead_time, op: lt, value: 0.25}
    explanation: >
      Completas el giro de hombros justo antes de golpear. Sin tiempo para preparar, el swing se
      acelera de golpe y el impacto suele llegar tarde y atrás.
    correction: >
      Empieza el giro de hombros en cuanto identificas que la bola viene a tu derecha, antes de que
      bote. Llega preparado y espera la bola, no la persigas con la raqueta.
    drills:
      - "Peloteo diciendo en voz alta '¡ya!' al girar, antes del bote de la bola."
      - "Lanzamientos del entrenador: prepara y congela la posición hasta que la bola bote."
    references:
      - "Elliott B, Reid M, Crespo M. Biomechanics of Advanced Tennis. ITF, 2003."

  - id: FH-BASE-001
    title: Base demasiado estrecha
    category: fundamental
    impact: 4
    difficulty: 1
    views: [front, back]
    when:
      all:
        - {metric: stance_width_ratio, op: lt, value: 0.9}
    explanation: >
      En el impacto tus pies están más juntos que la anchura de tus hombros. Con una base estrecha
      pierdes equilibrio y no puedes empujar desde el suelo ni girar la cadera con firmeza.
    correction: >
      Abre los pies algo más que la anchura de los hombros al preparar, con el peso repartido en la
      parte delantera de los pies.
    drills:
      - "Dos líneas en el suelo separadas un poco más que tus hombros: golpea con un pie en cada línea."
      - "Sombra con pausa en la preparación comprobando la anchura de la base."

  - id: FH-HEAD-001
    title: La cabeza se mueve en el impacto
    category: fundamental
    impact: 4
    difficulty: 2
    when:
      all:
        - {metric: head_stability, op: gt, value: 0.35}
    explanation: >
      La cabeza se desplaza justo cuando golpeas (normalmente por levantar la vista para mirar adónde
      va la bola). Eso mueve todo el eje del cuerpo y empeora la precisión del impacto.
    correction: >
      Mantén la cabeza quieta y la mirada en el punto de impacto hasta que la bola haya salido de la
      raqueta; mira el resultado después.
    drills:
      - "Golpea y mantén la vista en el punto de impacto contando 'uno' antes de levantar la cabeza."
      - "Peloteo con el compañero diciendo el color/número escrito en la bola en el impacto."

  - id: FH-SWING-001
    title: Swing plano (la raqueta no baja por debajo de la bola)
    category: fundamental
    impact: 3
    difficulty: 3
    views: [side]
    when:
      all:
        - {metric: racket_drop_below_contact, op: lt, value: 0.05}
    explanation: >
      La raqueta no baja por debajo de la altura del impacto antes de ir hacia la bola, así que el swing
      es horizontal o de arriba abajo. La bola sale con poco efecto liftado y cuesta pasarla alta y
      segura sobre la red.
    correction: >
      Tras la preparación deja caer la cabeza de la raqueta por debajo de la bola y golpea de abajo
      hacia arriba, terminando alto. (Si buscas un golpe plano a propósito, ignora este aviso).
    drills:
      - "Golpes desde rodillas o sentado en un cajón: obliga a subir la raqueta para pasar la red."
      - "Pasar la bola por encima de una cuerda colocada a 1 m sobre la red."

  - id: FH-LEG-001
    title: Flexionas pero no empujas con las piernas
    category: sincronizacion
    impact: 4
    difficulty: 3
    when:
      all:
        - {metric: knee_angle_min, op: lt, value: 150}
        - {metric: leg_drive, op: lt, value: 8}
    explanation: >
      Flexionas las rodillas al preparar, pero no las extiendes hacia el impacto. La energía que
      cargas en las piernas no llega al golpe.
    correction: >
      Empieza el swing empujando el suelo: extiende las rodillas mientras giras la cadera, como si
      quisieras subir ligeramente hacia la bola.
    drills:
      - "Sombra 'baja-empuja-gira': flexiona, empuja el suelo y deja que la cadera arrastre el brazo."
      - "Saltos verticales cortos desde la posición de preparación (3 x 8) antes de golpear."

  - id: FH-ARM-002
    title: Brazo libre inactivo en la preparación
    category: sincronizacion
    impact: 3
    difficulty: 1
    when:
      all:
        - {metric: off_arm_extension, op: lt, value: 0.15}
    explanation: >
      El brazo no dominante se queda pegado al cuerpo durante la preparación. Ese brazo ayuda a girar
      los hombros, a medir la distancia a la bola y a equilibrar el giro del tronco.
    correction: >
      Al preparar, estira el brazo libre por delante del cuerpo, señalando la bola, y recógelo hacia el
      pecho cuando empieces el swing.
    drills:
      - "Sujeta la garganta de la raqueta con la mano libre al preparar y suéltala al girar."
      - "Sombra señalando la bola con la mano libre hasta el último momento."

  # ---------- Puntos fuertes ----------
  - id: FH-STR-008
    title: Preparación temprana
    category: fundamental
    polarity: strength
    impact: 5
    difficulty: 2
    when:
      all:
        - {metric: unit_turn_lead_time, op: gte, value: 0.5}
    explanation: Completas el giro de hombros con tiempo antes del impacto.
    why_it_matters: >
      Llegar preparado te permite esperar la bola, ajustar la distancia y golpear por delante.
    how_to_maintain: >
      Mantén el hábito de girar en cuanto lees la dirección de la bola, también con bolas rápidas.

  - id: FH-STR-009
    title: Base amplia y estable
    category: fundamental
    polarity: strength
    impact: 3
    difficulty: 1
    views: [front, back]
    when:
      all:
        - {metric: stance_width_ratio, op: between, value: [1.2, 2.2]}
    explanation: Tus pies están bien separados en el impacto.
    why_it_matters: >
      Una base amplia da equilibrio y permite empujar desde el suelo y girar la cadera con firmeza.
    how_to_maintain: >
      Conserva esa anchura también cuando llegas a la bola corriendo.

  - id: FH-STR-010
    title: Cabeza quieta en el impacto
    category: fundamental
    polarity: strength
    impact: 4
    difficulty: 2
    when:
      all:
        - {metric: head_stability, op: lte, value: 0.1}
    explanation: Mantienes la cabeza estable mientras golpeas.
    why_it_matters: >
      Un eje estable hace el impacto más preciso y repetible.
    how_to_maintain: >
      Sigue mirando el punto de impacto hasta que la bola sale de la raqueta.

  - id: FH-STR-011
    title: Swing de abajo hacia arriba
    category: fundamental
    polarity: strength
    impact: 3
    difficulty: 3
    views: [side]
    when:
      all:
        - {metric: racket_drop_below_contact, op: gte, value: 0.15}
    explanation: La raqueta baja por debajo de la bola y sube hacia el impacto.
    why_it_matters: >
      Ese recorrido genera efecto liftado: la bola pasa alta sobre la red y cae dentro de la pista.
    how_to_maintain: >
      Mantén la caída de la raqueta tras la preparación y termina alto.

  - id: FH-STR-012
    title: Empuje de piernas activo
    category: sincronizacion
    polarity: strength
    impact: 4
    difficulty: 3
    suppressed_by: [FH-POST-001]
    when:
      all:
        - {metric: leg_drive, op: gte, value: 20}
    explanation: Extiendes las rodillas hacia el impacto.
    why_it_matters: >
      El golpe empieza en el suelo: las piernas inician la cadena cinética y aportan potencia.
    how_to_maintain: >
      Sigue empujando el suelo al iniciar el swing, sin saltar antes de tiempo.

  - id: FH-STR-013
    title: Brazo libre activo
    category: sincronizacion
    polarity: strength
    impact: 2
    difficulty: 1
    when:
      all:
        - {metric: off_arm_extension, op: gte, value: 0.3}
    explanation: Estiras el brazo libre hacia la bola durante la preparación.
    why_it_matters: >
      Ayuda a girar los hombros, a medir la distancia a la bola y a equilibrar el cuerpo.
    how_to_maintain: >
      Recógelo hacia el pecho al iniciar el swing para acelerar el giro del tronco.
