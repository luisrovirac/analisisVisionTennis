<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal profesional</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="wide">
  <header>
    <h1>Portal profesional</h1>
    <p class="lead">Los expertos proponen mejoras a las reglas del análisis; los validadores las aprueban. Lo aprobado se aplica automáticamente a todos los análisis.</p>
    <div class="session">
      <a href="index.html">← Mis análisis</a>
      <span id="session-user"></span>
      <button id="logout" type="button" class="secondary" hidden>Cerrar sesión</button>
    </div>
  </header>

  <section id="login-card" class="card" hidden>
    <p>Inicia sesión para entrar al portal.</p>
    <button id="login" type="button">Iniciar sesión</button>
  </section>

  <nav id="tabs" class="tabs" aria-label="Secciones del portal"></nav>
  <p id="flash" role="status" aria-live="polite"></p>
  <section id="view"></section>
</main>
<script src="auth.js"></script>
<script src="portal.js"></script>
</body>
</html>
